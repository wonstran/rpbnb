name: tests

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:      # manually trigger the slow tiers
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC: exercise the slow tiers

permissions:
  contents: read

jobs:
  fast:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload, local::.
      - name: Fast test tier
        run: Rscript tools/test-tiers.R fast

  # The two slow tiers (end-to-end prediction fits and the copula file) are
  # expensive, so they run only on the weekly schedule and on manual dispatch,
  # keeping push/PR feedback fast while still protecting the slow tiers from
  # regression.
  slow:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgload, local::.
      - name: Slow test tiers (prediction + copula)
        run: Rscript tools/test-tiers.R all
